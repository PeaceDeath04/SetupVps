---


# ============================================================
# SSH SERVER
# ============================================================

ssh_server_ports:
  - "Укажи_Порт"

# Разрешаем SSH-подключение только этим пользователям.
# root, ubuntu и другие пользователи через SSH подключиться не смогут.
ssh_allow_users: "Укажи_Пользователей через_пробел"

# Полностью запрещаем прямой вход под root через SSH.
# При этом sudo для пользователей продолжит работать.
ssh_permit_root_login: "no"

# Запрещаем вход по паролю.
# Подключение будет возможно только с помощью SSH-ключа.
ssh_server_password_login: false

# Разрешаем аутентификацию с помощью публичного SSH-ключа.
ssh_pubkey_authentication: true

# Требуем именно publickey для входа.
# То есть SSH не будет предлагать пароль как альтернативный способ.
sshd_authenticationmethods: publickey


# ============================================================
# ЗАЩИТА ОТ ПЕРЕБОРА SSH
# ============================================================

# Максимальное количество неудачных попыток аутентификации
# в рамках одного SSH-подключения.
ssh_max_auth_retries: 2


# ============================================================
# SSH FORWARDING
# ============================================================

# Запрещаем TCP forwarding.
# Это ограничивает возможность использовать сервер
# как промежуточный туннель.
ssh_allow_tcp_forwarding: "no"

# Запрещаем GatewayPorts.
# SSH не сможет выставлять проброшенные порты
# на внешние интерфейсы сервера.
ssh_gateway_ports: false

# Запрещаем SSH agent forwarding.
# Приватный SSH-ключ с твоего компьютера не будет
# проксироваться через сервер.
ssh_allow_agent_forwarding: false

# Запрещаем X11 forwarding.
# X11 нужен для удалённого запуска графических приложений.
# На нашем VPS он не нужен.
ssh_x11_forwarding: false


# ============================================================
# GSSAPI / KERBEROS
# ============================================================

# Отключаем GSSAPI.
# Для нашей схемы авторизации SSH он не нужен.
ssh_gssapi_support: false

# Отключаем передачу GSSAPI credentials.
ssh_gssapi_delegation: false


# ============================================================
# SSH CLIENT
# ============================================================

# Отключаем старый SSH roaming.
# Это дополнительная настройка безопасности SSH-клиента.
ssh_client_roaming: false


# ============================================================
# ENVIRONMENT VARIABLES
# ============================================================

# Запрещаем SSH-клиенту передавать переменные окружения
# на сервер через механизм AcceptEnv.
ssh_server_permit_environment_vars: "no"


# ============================================================
# LOGIN / MOTD
# ============================================================

# Не показываем стандартное сообщение MOTD при входе.
ssh_print_motd: false

# Не показываем PAM MOTD.
ssh_print_pam_motd: false

# Не показываем информацию о последнем входе.
ssh_print_last_log: false

# Не показываем стандартный Debian banner.
ssh_print_debian_banner: false


# ============================================================
# SSH CRYPTOGRAPHY
# ============================================================

# Не разрешаем использовать слишком маленькие параметры
# для Diffie-Hellman moduli.
# Значение 2048 означает минимальный размер 2048 бит.
sshd_moduli_minimum: 2048


# ============================================================
# SSH CONFIGURATION
# ============================================================

# Требуем строгую проверку прав доступа к SSH-файлам.
# Например, ~/.ssh и authorized_keys не должны быть
# доступны для записи посторонним пользователям.
sshd_strict_modes: true

# Уровень логирования SSH.
# VERBOSE даёт больше информации в системных логах,
# чем стандартный уровень.
sshd_log_level: VERBOSE

# Куда SSH будет отправлять сообщения авторизации.
# AUTH — стандартная категория для таких событий.
sshd_syslog_facility: AUTH
